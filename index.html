    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #181e21;
            color: #fff;
        }
        
        .page-home {
            max-width: 600px;
            margin: 0 auto;
            background-color: #181e21;
            min-height: 100vh;
        }
        
        /* Прямоугольная обложка */
        .cover-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 300px;
        }
        
        /* Заголовок */
        .vcard-header {
            background: linear-gradient(135deg, #181e21 0%, #2a2f33 100%);
            padding: 20px 0;
        }
        
        .event-content-container {
            text-align: center;
            padding: 10px 20px 20px;
        }
        
        .event-title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        
        .event-teaser {
            font-size: 16px;
            color: #ccc;
            margin-top: 8px;
        }
        
        /* Кнопки соцсетей */
        .event-body {
            padding: 20px;
        }
        
        .channel-container {
            display: flex;
            align-items: center;
            background-color: #2a2f33;
            border-radius: 16px;
            padding: 8px 20px;
            margin-bottom: 12px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .channel-container:hover {
            transform: translateY(-2px);
            background-color: #3a3f44;
        }
        
        /* Общий контейнер иконки */
        .channel-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        /* Круглые иконки для Telegram и WhatsApp */
        .channel-icon.rounded {
            border-radius: 50%;
            background-color: transparent;
        }
        
        /* Квадратные с закруглением для VK и MAX */
        .channel-icon.square {
            border-radius: 12px;
            background-color: transparent;
        }
        
        .channel-icon svg {
            width: 44px;
            height: 44px;
            display: block;
        }
        
        /* Для Telegram и WhatsApp — цветные круги */
        .channel-icon.telegram svg circle,
        .channel-icon.whatsapp svg circle {
            fill: #26A5E4;
        }
        
        .channel-name {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
        }
        
        .channel-label {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
        }
        
        /* Кнопка Share */
        .share-container {
            margin-top: 30px;
            text-align: center;
        }
        
        .fab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #0ec82a;
            padding: 12px 24px;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        
        .fab:hover {
            background-color: #0ab022;
            transform: translateY(-2px);
        }
        
        .icon-fab-share:before {
            content: "📤";
            margin-right: 5px;
        }
        
        .copy-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0ec82a;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        .copy-message.show {
            opacity: 1;
        }
        
        @media (max-width: 480px) {
            .event-title { font-size: 24px; }
            .channel-container { padding: 6px 16px; }
            .channel-icon svg { width: 40px; height: 40px; }
            .cover-image { max-height: 200px; }
        }
    </style>

            <!-- Кнопка Share -->
            <div class="share-container">
                <button class="fab" id="shareButton">

    <div class="copy-message" id="copyMessage">Ссылка скопирована! 🔗</div>
    
    <script>
        const pageUrl = window.location.href;
        const shareBtn = document.getElementById('shareButton');
        const copyMsg = document.getElementById('copyMessage');
        
        shareBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'Ростислав Ярком',
                    text: 'Художественная роспись и декор',
                    url: pageUrl
                }).catch(err => console.log('Ошибка:', err));
            } else {
                copyToClipboard(pageUrl);
            }
        });
        
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            copyMsg.classList.add('show');
            setTimeout(() => copyMsg.classList.remove('show'), 2000);
        }
    </script>
