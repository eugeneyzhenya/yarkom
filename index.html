<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ростислав Ярком | Художник, графический дизайнер</title>
    <meta name="description" content="Художественная роспись в интерьере и экстерьере. Аэрография, интерьерные картины, барельеф, графический дизайн, цифровая иллюстрация.">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #181e21;
            color: #fff;
        }
        
        .page-home {
            max-width: 600px;
            margin: 0 auto;
            background-color: #181e21;
            min-height: 100vh;
        }
        
        .vcard-header {
            position: relative;
            background: linear-gradient(135deg, #181e21 0%, #2a2f33 100%);
            padding-bottom: 20px;
        }
        
        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto;
            background-size: cover !important;
            background-position: center !important;
            border: 3px solid #0ec82a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .event-content-container {
            text-align: center;
            padding: 20px;
        }
        
        .event-title {
            font-size: 28px;
            font-weight: 700;
            margin-top: 15px;
            color: #fff;
        }
        
        .event-teaser {
            font-size: 16px;
            color: #ccc;
            margin-top: 8px;
        }
        
        .event-body {
            padding: 20px;
        }
        
        .channel-container {
            display: flex;
            align-items: center;
            background-color: #2a2f33;
            border-radius: 50px;
            padding: 8px 20px;
            margin-bottom: 12px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .channel-container:hover {
            transform: translateY(-2px);
            background-color: #3a3f44;
        }
        
        .channel-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .channel-bgd-Telegram { background: #26A5E4; }
        .channel-bgd-WhatsApp { background: #25D366; }
        .channel-bgd-VKontakte { background: #0077FF; }
        .channel-bgd-MAX { background: #FF5A00; }
        
        .channel-name {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
        }
        
        .channel-label {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
        }
        
        /* ПРАВИЛЬНАЯ ИКОНКА VK */
        .icon-vk svg {
            width: 24px;
            height: 24px;
        }
        
        /* ПРАВИЛЬНАЯ ИКОНКА MAX */
        .icon-max svg {
            width: 24px;
            height: 24px;
        }
        
        .share-container {
            margin-top: 30px;
            text-align: center;
        }
        
        .fab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #0ec82a;
            padding: 12px 24px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
            cursor: pointer;
            border: none;
        }
        
        .fab:hover {
            background-color: #0ab022;
            transform: translateY(-2px);
        }
        
        .icon-fab-share:before {
            content: "📤";
            margin-right: 5px;
        }
        
        .copy-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0ec82a;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .copy-message.show {
            opacity: 1;
        }
        
        @media (max-width: 480px) {
            .event-title { font-size: 24px; }
            .avatar-container { width: 100px; height: 100px; }
            .channel-container { padding: 6px 16px; }
        }
    </style>
</head>
<body>

                    </svg>

            <!-- WhatsApp -->
            <a href="https://wa.me/79603533159" target="_blank" class="channel-container">

                <div>
                    <div class="channel-name">VKontakte</div>
                    <div class="channel-label">rostislavyarkom</div>

            <!-- MAX (ПРАВИЛЬНАЯ ИКОНКА с буквой М) -->
            <a href="https://max.ru/u/f9LHodD0cOKFW_rFgBiBFIQhpFevtsfprdDgTQwaVyYDt_6wsfhufDaDmhg" target="_blank" class="channel-container">
                <div class="channel-icon channel-bgd-MAX">

                        <path d="M5 17H8L12 8L16 17H19L13 5H11L5 17Z" fill="white"/>

            <div class="share-container">
                <button class="fab" id="shareButton">
                    <i class="icon-fab-share"></i> Поделиться страницей
                </button>
            </div>
        </div>
    </div>
    
    <div class="copy-message" id="copyMessage">Ссылка скопирована! 🔗</div>
    
    <script>
        const pageUrl = window.location.href;
        
        document.getElementById('shareButton').addEventListener('click', function() {
            if (navigator.share) {
                navigator.share({
                    title: 'Ростислав Ярком',
                    text: 'Художественная роспись и декор',
                    url: pageUrl
                }).catch(err => console.log('Ошибка:', err));
            } else {
                copyToClipboard(pageUrl);
            }
        });
        
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const msg = document.getElementById('copyMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }
        
        document.querySelectorAll('.channel-container').forEach(link => {
            link.setAttribute('target', '_blank');
        });
    </script>
</body>
</html>
